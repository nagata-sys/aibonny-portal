<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIBONNY スクールポータル</title>
  <meta name="description" content="AIBONNY 個別伴走プランの動画・宿題・スケジュールを一元管理するポータル" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css?v=20260713" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2315294f'/%3E%3Cg fill='none' stroke='%231fbfe6' stroke-width='1.7' stroke-linecap='round'%3E%3Ccircle cx='8' cy='8' r='1.8'/%3E%3Ccircle cx='16' cy='8' r='1.8'/%3E%3Cpath d='M6 17c3-1 9-1 12-9M7 12c2 4 8 4 10-3'/%3E%3C/g%3E%3C/svg%3E" />
</head>
<body class="booting">
  <!-- ============ 起動ローダー ============ -->
  <div id="boot" class="boot"><div class="spinner"></div></div>

  <!-- ============ ログイン画面 ============ -->
  <div id="login" class="login">
    <div class="login-card">
      <img class="login-logo" src="assets/aibonny-logo-2.png" alt="AIBONNY ― AIを相棒に" />
      <div class="login-sub">受講生ポータル ログイン</div>
      <form id="loginForm" class="login-form" autocomplete="on">
        <label>会員番号
          <input id="li-no" inputmode="numeric" autocomplete="username" placeholder="例: 10001" required />
        </label>
        <label>パスワード
          <input id="li-pw" type="password" autocomplete="current-password" placeholder="パスワード" required />
        </label>
        <div class="login-err" id="loginErr"></div>
        <button class="btn login-btn" type="submit" id="loginBtn">ログイン</button>
      </form>
      <div class="login-note">会員番号・パスワードは運営から発行されます。</div>
    </div>
  </div>

  <div class="app" id="app">
    <!-- ============ アプリバー ============ -->
    <header class="appbar">
      <button class="hamburger" id="hamburger" aria-label="メニュー">
        <svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="brand">
        <img class="logo" src="assets/aibonny-logo-2.png" alt="AIBONNY ― AIを相棒に" />
        <div class="divider"></div>
        <span class="ptag">SCHOOL PORTAL</span>
      </div>
      <div class="user" id="studentChip" role="button" tabindex="0" aria-label="アカウント設定を開く">
        <div class="uinfo">
          <div class="uname" id="chipWho">受講生 さん</div>
          <div class="uno" id="chipNo">1期</div>
        </div>
        <div class="uav" id="chipAv">受</div>
      </div>
    </header>

    <div class="backdrop" id="backdrop"></div>

    <!-- ============ シェル ============ -->
    <div class="shell">
      <aside class="sidebar">
        <nav class="nav" id="nav">
          <a href="#home" data-view="home">
            <svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/></svg>
            <span>ホーム</span>
          </a>
          <a href="#curriculum" data-view="curriculum">
            <svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></svg>
            <span>動画レッスン</span>
            <em class="nbadge" id="taskBadge" style="display:none">0</em>
          </a>
          <a href="#roadmap" data-view="roadmap">
            <svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3.5 6.2v14L9 18l6 2 5.5-2.2V3.8L15 6 9 4z"/><path d="M9 4v14M15 6v14"/></svg>
            <span>ロードマップ</span>
          </a>
          <a href="#seminars" data-view="seminars">
            <svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2.5"/><path d="M12 17v3M8.5 20h7M8 10.5l2.3 2.3L14.5 8.5"/></svg>
            <span>セミナー予約</span>
          </a>
          <a href="#community" data-view="community">
            <svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 5.2a3 3 0 0 1 0 5.6M16.5 19a5.6 5.6 0 0 0-2.4-4.6"/></svg>
            <span>コミュニティ</span>
          </a>
          <a href="#resources" data-view="resources">
            <svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h3.5l2 2.5H19a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <span>リソース</span>
          </a>
        </nav>
        <div class="side-foot">
          <div class="mini-label"><span>全体の進捗</span><b id="sideProgPct">0%</b></div>
          <div class="mini-bar"><i id="sideProgBar" style="width:0%"></i></div>
          <button class="logout-btn" id="logoutBtn">
            <svg class="icn-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v2"/><path d="M19 12H9m10 0-3-3m3 3-3 3"/></svg>
            ログアウト
          </button>
        </div>
      </aside>

      <main class="content">
        <section class="view" id="view-home"></section>
        <section class="view" id="view-curriculum"></section>
        <section class="view" id="view-lesson"></section>
        <section class="view" id="view-roadmap"></section>
        <section class="view" id="view-seminars"></section>
        <section class="view" id="view-community"></section>
        <section class="view" id="view-resources"></section>
      </main>
    </div>
  </div>

  <!-- ============ アカウント設定モーダル ============ -->
  <div class="modal" id="accountModal">
    <div class="scrim" data-close></div>
    <div class="box account-box">
      <div class="mbar2">
        <div class="mt2">アカウント設定</div>
        <button class="x" data-close aria-label="閉じる">
          <svg class="icn-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="account-body" id="accountBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="assets/config.js?v=20260713"></script>
  <script src="assets/data.js?v=20260713"></script>
  <script src="assets/supa.js?v=20260713"></script>
  <script src="assets/app.js?v=20260713"></script>
</body>
</html>
